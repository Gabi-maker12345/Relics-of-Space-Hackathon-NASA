name: Deploy production

# Depois do CI ficar verde num push para a milestone, publica em produção.
# (O auto-deploy nativo do Vercel só cobre a "Production Branch" do projeto,
# que está em `master`; este workflow faz o equivalente para esta branch.)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - 'feat/backend-milestone-*'
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Vercel · produção
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull project settings and env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado em $url"

      - name: Summary
        run: |
          echo "### Produção" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://relics-of-space.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
