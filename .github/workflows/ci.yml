name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'feat/backend-milestone-*'
      - 'be-**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders. CI does not talk to a real Supabase project;
      # database integration tests are opt-in and run only when secrets exist.
      NUXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NUXT_PUBLIC_SUPABASE_KEY: ci-anon-key
      NUXT_SUPABASE_SECRET_KEY: ci-secret-key
      # Public URL used by the seed generator; must match the committed seed.
      SUPABASE_STORAGE_BASE: https://atcfpxpbhmxeqrnmrblq.supabase.co/storage/v1/object/public/relic-media/assets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Seed is up to date
        run: npm run seed:check

      - name: Narration files are present
        run: npm run narration:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
